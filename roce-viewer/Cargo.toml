[package]
name = "roce-viewer"
version = "0.1.0"
edition = "2021"
description = "輕量本地端 ROCE 財務分析工具（Rust 版）"

[[bin]]
name = "roce-viewer"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "gzip"] }
webbrowser = "1"
regex = "1"
once_cell = "1"
anyhow = "1"
tower-http = { version = "0.5", features = ["cors"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
