<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROCE 財務工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;color:#1a1a2e;font-size:14px}
header{background:#1a1a2e;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
header h1{font-size:16px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.search-wrap{flex:1;max-width:400px;position:relative}
#search{width:100%;padding:7px 12px;border:none;border-radius:6px;font-size:14px;background:#2d2d44;color:#fff;outline:none}
#search::placeholder{color:#888}
#search-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.15);z-index:200;max-height:320px;overflow-y:auto}
.sr-item{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f0f0}
.sr-item:hover{background:#f0f4ff}
.sr-item:last-child{border-bottom:none}
.sr-code{font-weight:700;color:#2563eb;width:54px;flex-shrink:0}
.sr-name{flex:1;margin:0 8px}
.sr-ind{font-size:12px;color:#888;text-align:right}
nav{display:flex;gap:4px}
nav button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#ccc;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;transition:.15s}
nav button.active,nav button:hover{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.5)}
main{max-width:1080px;margin:0 auto;padding:20px}
.panel{display:none}
.panel.active{display:block}
/* --- Analysis --- */
.stock-header{background:#fff;border-radius:12px;padding:18px 22px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.stock-title{flex:1 1 200px}
.stock-title h2{font-size:20px;font-weight:700}
.stock-title .sub{color:#666;font-size:13px;margin-top:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.badge-listed{background:#dbeafe;color:#1d4ed8}
.badge-otc{background:#fce7f3;color:#9d174d}
.metrics-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.metric-box{background:#f8faff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;min-width:100px;text-align:center}
.metric-box .val{font-size:20px;font-weight:700;color:#1e40af}
.metric-box .lbl{font-size:11px;color:#888;margin-top:2px}
.metric-box .val.good{color:#059669}
.metric-box .val.warn{color:#d97706}
.metric-box .val.bad{color:#dc2626}
.wl-btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
.wl-btn.add{background:#2563eb;color:#fff}
.wl-btn.remove{background:#fee2e2;color:#dc2626}
.wl-btn:hover{opacity:.85}
.refresh-btn{padding:8px 16px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;font-size:13px;color:#475569;margin-left:6px}
.refresh-btn:hover{background:#f1f5f9}
/* --- Tables --- */
.section{background:#fff;border-radius:12px;padding:18px 22px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.section-title{font-size:12px;font-weight:700;letter-spacing:1px;color:#64748b;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.source-badge{background:#e0f2fe;color:#0369a1;padding:2px 7px;border-radius:4px;font-size:11px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;color:#64748b;text-align:right;padding:6px 8px;border-bottom:2px solid #e2e8f0;white-space:nowrap}
th:first-child{text-align:left}
td{padding:8px 8px;text-align:right;border-bottom:1px solid #f1f5f9;font-size:13px}
td:first-child{text-align:left;font-weight:600}
tr:last-child td{border-bottom:none}
tr.current-year{background:#f0f9ff}
.ok-badge{background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.warn-badge{background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;cursor:default}
.mops-badge{background:#e0e7ff;color:#4338ca;padding:2px 7px;border-radius:4px;font-size:11px}
.note{font-size:11px;color:#92400e;margin-top:2px}
/* --- Summary grid --- */
.fin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.fin-item{background:#f8faff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px}
.fin-item .label{font-size:11px;color:#64748b;margin-bottom:4px}
.fin-item .value{font-size:16px;font-weight:600}
/* --- Watchlist --- */
.wl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.wl-card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer;transition:.15s;border:2px solid transparent}
.wl-card:hover{border-color:#2563eb;transform:translateY(-1px)}
.wl-card h3{font-size:15px;font-weight:700}
.wl-card .sub{color:#888;font-size:12px;margin-bottom:10px}
.wl-card .row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px solid #f0f0f0}
.wl-card .row:last-child{border:none}
/* --- Screen --- */
.screen-controls{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.screen-controls label{font-size:13px;color:#475569}
.screen-controls input,select{padding:6px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px}
.screen-btn{padding:8px 18px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.screen-btn:hover{background:#1d4ed8}
.roce-high{color:#059669;font-weight:700}
.roce-med{color:#d97706;font-weight:700}
/* --- Misc --- */
.empty{padding:40px;text-align:center;color:#94a3b8;font-size:14px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.2);opacity:0;transition:opacity .3s;z-index:999}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>📊 ROCE 財務工具</h1>
  <div class="search-wrap">
    <input id="search" type="text" placeholder="輸入股票代號或名稱…" autocomplete="off">
    <div id="search-results"></div>
  </div>
  <nav>
    <button id="tab-watchlist" onclick="showTab('watchlist')">觀察清單</button>
    <button id="tab-screen" onclick="showTab('screen')">市場篩選</button>
    <button id="tab-analysis" onclick="showTab('analysis')">個股分析</button>
    <button id="tab-scan" onclick="showTab('scan')">市場掃描</button>
  </nav>
</header>

<main>
  <!-- WATCHLIST TAB -->
  <div id="panel-watchlist" class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 style="font-size:16px;font-weight:700">觀察清單</h2>
      <button class="refresh-btn" onclick="refreshCatalog()">🔄 更新行情 / 財報目錄</button>
    </div>
    <div id="watchlist-content"><div class="empty">載入中…</div></div>
  </div>

  <!-- SCREEN TAB -->
  <div id="panel-screen" class="panel">
    <div class="screen-controls">
      <label>最低 ROCE (%)</label>
      <input type="number" id="sc-roce" value="15" min="0" max="100" style="width:80px">
      <label>最低分數</label>
      <input type="number" id="sc-score" value="0" min="0" max="100" style="width:70px">
      <label>年度</label>
      <input type="number" id="sc-year" placeholder="最新" style="width:90px">
      <label>產業</label>
      <input type="text" id="sc-ind" placeholder="全部" style="width:120px">
      <label>規模</label>
      <select id="sc-band">
        <option value="">全部</option>
        <option value="small">小型</option>
        <option value="medium">中型</option>
        <option value="large">大型</option>
      </select>
      <button class="screen-btn" onclick="runScreen()">篩選</button>
    </div>
    <div id="screen-content"><div class="empty">點擊「篩選」開始</div></div>
  </div>

  <!-- ANALYSIS TAB -->
  <div id="panel-analysis" class="panel">
    <div id="analysis-content"><div class="empty">請搜尋並選擇一檔股票</div></div>
  </div>

  <!-- MARKET SCAN TAB -->
  <div id="panel-scan" class="panel">
    <div style="background:#fff;border-radius:12px;padding:18px 22px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)">
      <h2 style="font-size:15px;font-weight:700;margin-bottom:12px">市場全掃描（MOPS 批次抓取年報）</h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
        <label>截止年度</label>
        <input type="number" id="scan-year" value="2024" style="width:90px;padding:6px 10px;border:1px solid #cbd5e1;border-radius:6px">
        <label>年數</label>
        <input type="number" id="scan-years" value="3" min="1" max="20" style="width:70px;padding:6px 10px;border:1px solid #cbd5e1;border-radius:6px">
        <button class="screen-btn" onclick="startScan()">▶ 開始掃描</button>
        <button class="refresh-btn" onclick="pauseScan()">⏸ 暫停</button>
        <button class="refresh-btn" onclick="loadScanStatus()">↻ 刷新狀態</button>
      </div>
      <div id="scan-status"><div class="empty">點擊「刷新狀態」查看進度</div></div>
    </div>
    <div style="background:#fff;border-radius:12px;padding:18px 22px;box-shadow:0 1px 4px rgba(0,0,0,.08)">
      <h2 style="font-size:15px;font-weight:700;margin-bottom:12px">評分範本設定</h2>
      <div id="template-content"><div class="empty"><span class="spinner"></span>載入中…</div></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="screen-btn" onclick="saveTemplate()">儲存範本</button>
        <button class="refresh-btn" onclick="resetTemplate()">還原預設</button>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const FCF_DEF = "FCF_PPE = 營業活動現金流量 - |取得不動產、廠房及設備|；V1 顯示無形資產支出但不自動納入資本支出。若 FCF/股的股數來源為「NetIncome/EPS 推估」，則為推估值，並非正式加權平均股數。";

// ---------------------------------------------------------------------------
// Utility
// ---------------------------------------------------------------------------
const fmt = {
  yi: v => v == null ? '-' : (v / 100000).toFixed(1) + ' 億',
  pct: v => v == null ? '-' : v.toFixed(1) + '%',
  num: v => v == null ? '-' : v.toFixed(2),
  shares: v => v == null ? '-' : (v / 1e6).toFixed(1) + ' 百萬股',
  price: v => v == null ? '-' : v.toFixed(2),
};

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ---------------------------------------------------------------------------
// Tab navigation
// ---------------------------------------------------------------------------
let currentTab = 'watchlist';
function showTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  currentTab = name;
  if (name === 'watchlist') loadWatchlist();
  if (name === 'scan') { loadScanStatus(); loadTemplate(); }
}

// ---------------------------------------------------------------------------
// Search
// ---------------------------------------------------------------------------
let searchTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (!q) { document.getElementById('search-results').innerHTML = ''; return; }
  searchTimer = setTimeout(() => doSearch(q), 250);
});
document.getElementById('search').addEventListener('blur', () => {
  setTimeout(() => { document.getElementById('search-results').innerHTML = ''; }, 200);
});

async function doSearch(q) {
  const res = await fetch(`/api/stocks?q=${encodeURIComponent(q)}`);
  const items = await res.json();
  const container = document.getElementById('search-results');
  if (!items.length) { container.innerHTML = '<div class="sr-item" style="color:#888">找不到符合結果</div>'; return; }
  container.innerHTML = items.map(s => `
    <div class="sr-item" onclick="selectStock('${s.stockNo}')">
      <span class="sr-code">${s.stockNo}</span>
      <span class="sr-name">${s.name}</span>
      <span class="sr-ind">${s.industryName}</span>
    </div>
  `).join('');
}

function selectStock(stockNo) {
  document.getElementById('search-results').innerHTML = '';
  document.getElementById('search').value = stockNo;
  loadAnalysis(stockNo);
  showTab('analysis');
}

// ---------------------------------------------------------------------------
// Analysis
// ---------------------------------------------------------------------------
async function loadAnalysis(stockNo) {
  document.getElementById('analysis-content').innerHTML = '<div class="empty"><span class="spinner"></span>載入中…</div>';
  try {
    const res = await fetch(`/api/stocks/${encodeURIComponent(stockNo)}/analysis`);
    if (!res.ok) { document.getElementById('analysis-content').innerHTML = `<div class="empty">無法載入：${await res.text()}</div>`; return; }
    renderAnalysis(await res.json());
  } catch(e) {
    document.getElementById('analysis-content').innerHTML = `<div class="empty">錯誤：${e}</div>`;
  }
}

function renderScore(score) {
  if (!score || score.totalScore == null) return '';
  const total = score.totalScore.toFixed(1);
  const color = total >= 80 ? '#059669' : total >= 60 ? '#d97706' : '#dc2626';
  const bars = (score.metrics || []).map(m => {
    const sc = m.score != null ? m.score.toFixed(0) : '-';
    const val = m.value != null ? m.value.toFixed(1) : '-';
    return `<div style="font-size:12px;padding:3px 0;display:flex;justify-content:space-between;gap:12px">
      <span style="color:#475569">${m.label}</span>
      <span style="color:#666">${val}%</span>
      <span style="min-width:36px;text-align:right;font-weight:600;color:${m.score==null?'#94a3b8':m.score>=75?'#059669':m.score>=50?'#d97706':'#dc2626'}">${sc}分</span>
      <span style="color:#94a3b8;font-size:11px">權重${m.weight}%</span>
    </div>`;
  }).join('');
  return `<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px;margin-top:10px">
    <div style="font-weight:700;font-size:15px;color:${color};margin-bottom:8px">品質評分：${total} 分（覆蓋率 ${score.coveragePercent.toFixed(0)}%）</div>
    ${bars}
  </div>`;
}

function renderPeer(peer) {
  if (!peer) return '';
  const bandLabel = {Small:'小型', Medium:'中型', Large:'大型'}[peer.sizeBand] || peer.sizeBand;
  return `<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px;margin-top:10px">
    <div style="font-weight:700;margin-bottom:6px">同業比較（${peer.industryName}）</div>
    <div style="font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:4px">
      <span>產業排名：<b>${peer.roceRank} / ${peer.sampleSize}</b></span>
      <span>產業中位 ROCE：<b>${peer.medianRoce.toFixed(1)}%</b></span>
      <span>規模：<b>${bandLabel}</b>（排 ${peer.sizeRoceRank} / ${peer.sizeSampleSize}）</span>
      <span>規模中位 ROCE：<b>${peer.sizeMedianRoce.toFixed(1)}%</b></span>
    </div>
  </div>`;
}

function renderAnalysis(data) {
  const s = data.stock;
  const hist = data.annualHistory || [];
  const latest = hist[0];

  const mktBadge = s.market === 0
    ? '<span class="badge badge-listed">上市</span>'
    : '<span class="badge badge-otc">上櫃</span>';

  const roce    = latest?.rocePercent;
  const roceClass = roce == null ? '' : roce >= 15 ? 'good' : roce >= 8 ? 'warn' : 'bad';

  const wlBtn = data.isOnWatchlist
    ? `<button class="wl-btn remove" onclick="toggleWatchlist('${s.stockNo}',false)">移除觀察清單</button>`
    : `<button class="wl-btn add" onclick="toggleWatchlist('${s.stockNo}',true)">加入觀察清單</button>`;

  const metricsHtml = `
    <div class="metrics-row">
      <div class="metric-box"><div class="val ${roceClass}">${fmt.pct(roce)}</div><div class="lbl">ROCE</div></div>
      ${latest?.roceWithInterestPercent != null ? `<div class="metric-box"><div class="val">${fmt.pct(latest.roceWithInterestPercent)}</div><div class="lbl">ROCE+利息</div></div>` : ''}
      <div class="metric-box"><div class="val">${fmt.pct(latest?.roePercent)}</div><div class="lbl">ROE</div></div>
      <div class="metric-box"><div class="val">${fmt.pct(latest?.operatingMarginPercent)}</div><div class="lbl">營業利益率</div></div>
      <div class="metric-box"><div class="val">${fmt.pct(latest?.debtRatioPercent)}</div><div class="lbl">負債比</div></div>
      <div class="metric-box"><div class="val">${fmt.pct(latest?.currentRatioPercent)}</div><div class="lbl">流動比率</div></div>
      <div class="metric-box"><div class="val">${fmt.num(s.peRatio)}</div><div class="lbl">本益比</div></div>
      <div class="metric-box"><div class="val">${fmt.price(s.closePrice)}</div><div class="lbl">收盤價 <span style="font-size:10px;color:${(s.priceChangePercent||0)>=0?'#059669':'#dc2626'}">${s.priceChangePercent!=null?(s.priceChangePercent>=0?'+':'')+s.priceChangePercent.toFixed(2)+'%':''}</span></div></div>
    </div>`;

  // Score section
  const scoreHtml = renderScore(data.score) + renderPeer(data.peerComparison);

  // FCF history table
  const defNote = `<p style="font-size:11px;color:#64748b;margin-bottom:10px">${FCF_DEF}</p>`;
  const fcfRows = hist.map((r, i) => {
    const review = r.reviewNote
      ? `<span class="warn-badge" title="${escHtml(r.reviewNote)}">需核對</span><br><span class="note">${escHtml(r.reviewNote)}</span>`
      : '<span class="ok-badge">OK</span>';
    return `<tr${i===0?' class="current-year"':''}>
      <td>${r.fiscalYear}</td>
      <td>${fmt.yi(r.operatingCashFlow)}</td>
      <td>${fmt.yi(r.capexPpe)}</td>
      <td><strong>${fmt.yi(r.fcf)}</strong></td>
      <td>${fmt.shares(r.weightedAverageShares)}<br><span style="font-size:10px;color:#888">${r.weightedAverageSharesSource||''}</span></td>
      <td>${r.fcfPerShare != null ? r.fcfPerShare.toFixed(2)+' 元' : '-'}</td>
      <td style="text-align:left">${review}</td>
    </tr>`;
  }).join('');
  const fcfTable = hist.length ? `${defNote}<div style="overflow-x:auto"><table>
    <thead><tr><th style="text-align:left">年度</th><th>營業現金流</th><th>PPE 資本支出</th><th>FCF</th><th>加權股數</th><th>FCF/股</th><th style="text-align:left">核對</th></tr></thead>
    <tbody>${fcfRows}</tbody></table></div>` : '<div class="empty">尚無年報資料</div>';

  // ROCE trend table (now with server-side metrics)
  const roceRows = hist.map(r => {
    const rc = r.rocePercent;
    const bar = rc != null ? `<div style="display:inline-block;width:${Math.min(rc*3,150)}px;height:8px;background:${rc>=15?'#10b981':rc>=8?'#f59e0b':'#ef4444'};border-radius:3px;vertical-align:middle;margin-left:4px"></div>` : '';
    const sc = r.score?.totalScore;
    return `<tr><td>${r.fiscalYear}</td>
      <td>${fmt.pct(rc)}${bar}</td>
      <td>${fmt.pct(r.roceWithInterestPercent)}</td>
      <td>${fmt.pct(r.roePercent)}</td>
      <td>${fmt.pct(r.operatingMarginPercent)}</td>
      <td>${fmt.pct(r.debtRatioPercent)}</td>
      <td>${fmt.pct(r.currentRatioPercent)}</td>
      <td>${fmt.pct(r.roaPercent)}</td>
      <td style="font-weight:${sc!=null?'700':'400'};color:${sc==null?'#94a3b8':sc>=80?'#059669':sc>=60?'#d97706':'#dc2626'}">${sc!=null?sc.toFixed(1):'-'}</td>
      <td>${fmt.yi(r.totalAssets)}</td>
    </tr>`;
  }).join('');
  const roceTable = hist.length ? `<div style="overflow-x:auto"><table>
    <thead><tr><th style="text-align:left">年度</th><th>ROCE</th><th>ROCE+利息</th><th>ROE</th><th>營業利益率</th><th>負債比</th><th>流動比率</th><th>ROA</th><th>品質分</th><th>資產總額</th></tr></thead>
    <tbody>${roceRows}</tbody></table></div>` : '';

  // Quarterly EPS table
  const qeps = data.quarterlyEpsObservations || [];
  const qepsRows = qeps.map(q => `<tr>
    <td>${q.label}</td>
    <td>${q.ytdEps != null ? q.ytdEps.toFixed(2) : '-'}</td>
    <td><b>${q.standaloneEps != null ? q.standaloneEps.toFixed(2) : '-'}</b></td>
  </tr>`).join('');
  const qepsHtml = qeps.length ? `<div style="overflow-x:auto"><table>
    <thead><tr><th style="text-align:left">期間</th><th>累計 EPS</th><th>單季 EPS</th></tr></thead>
    <tbody>${qepsRows}</tbody></table></div>` : '<div class="empty">尚無季報資料（可點擊 MOPS 刷新）</div>';

  // Financial summary
  const summaryItems = latest ? [
    ['營業收入', fmt.yi(latest.operatingRevenue)],
    ['營業利益', fmt.yi(latest.operatingIncome)],
    ['利息收入', fmt.yi(latest.interestIncome)],
    ['本期淨利', fmt.yi(latest.netIncome)],
    ['EPS', latest.eps != null ? latest.eps.toFixed(2)+' 元' : '-'],
    ['流動資產', fmt.yi(latest.currentAssets)],
    ['資產總額', fmt.yi(latest.totalAssets)],
    ['流動負債', fmt.yi(latest.currentLiabilities)],
    ['股東權益', fmt.yi(latest.totalEquity)],
  ] : [];
  const summaryHtml = summaryItems.length ? `
    <div class="fin-grid">${summaryItems.map(([l,v])=>`<div class="fin-item"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('')}</div>
    <p style="margin-top:8px;font-size:11px;color:#94a3b8">年度：${latest?.fiscalYear} · 來源：${latest?.sourceName}</p>
  ` : '<div class="empty">尚無財報摘要</div>';

  document.getElementById('analysis-content').innerHTML = `
    <div class="stock-header">
      <div class="stock-title">
        <h2>${s.stockNo} ${s.name} ${mktBadge}</h2>
        <div class="sub">${s.industryName} · ${s.quoteDate ? '報價日 '+s.quoteDate : '尚無行情'}</div>
        ${metricsHtml}
        ${scoreHtml}
      </div>
      <div style="display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap">
        ${wlBtn}
        <button class="refresh-btn" onclick="refreshStock('${s.stockNo}')">🔄 MOPS 刷新</button>
        <button class="refresh-btn" onclick="refreshPrices('${s.stockNo}')">📈 刷新股價</button>
      </div>
    </div>
    <div class="section"><div class="section-title">年度財報趨勢</div>${roceTable||'<div class="empty">尚無資料</div>'}</div>
    <div class="section"><div class="section-title">FCF 自由現金流歷史</div>${fcfTable}</div>
    <div class="section"><div class="section-title">季度 EPS 觀察</div>${qepsHtml}</div>
    <div class="section">
      <div class="section-title">年度財報摘要 ${latest?.sourceName==='MOPS iXBRL'?'<span class="mops-badge">MOPS iXBRL</span>':''}</div>
      ${summaryHtml}
    </div>
  `;
}

// ---------------------------------------------------------------------------
// Watchlist / toggle
// ---------------------------------------------------------------------------
async function loadWatchlist() {
  document.getElementById('watchlist-content').innerHTML = '<div class="empty"><span class="spinner"></span>載入中…</div>';
  try {
    const items = await (await fetch('/api/watchlist')).json();
    renderWatchlist(items);
  } catch(e) {
    document.getElementById('watchlist-content').innerHTML = `<div class="empty">錯誤：${e}</div>`;
  }
}

function renderWatchlist(items) {
  if (!items.length) {
    document.getElementById('watchlist-content').innerHTML = '<div class="empty">觀察清單為空，請搜尋股票並點擊「加入觀察清單」</div>';
    return;
  }
  const cards = items.map(c => {
    const rc = c.rocePercent;
    const roceColor = rc == null ? '' : rc >= 15 ? '#059669' : rc >= 8 ? '#d97706' : '#dc2626';
    const chg = c.priceChangePercent;
    const chgStr = chg != null ? (chg>=0?'+':'')+chg.toFixed(2)+'%' : '-';
    const sc = c.score;
    const scColor = sc == null ? '#94a3b8' : sc >= 80 ? '#059669' : sc >= 60 ? '#d97706' : '#dc2626';
    return `
    <div class="wl-card" onclick="selectStock('${c.stockNo}')">
      <h3>${c.stockNo} ${c.name}</h3>
      <div class="sub">${c.industryName}${c.fiscalYear ? ' · '+c.fiscalYear+'年' : ''}</div>
      <div class="row"><span>收盤價</span><span>${fmt.price(c.closePrice)} <span style="color:${chg!=null?(chg>=0?'#059669':'#dc2626'):''}">${chgStr}</span></span></div>
      <div class="row"><span>ROCE</span><span style="color:${roceColor};font-weight:700">${fmt.pct(rc)}</span></div>
      ${c.roceWithInterestPercent != null ? `<div class="row"><span>ROCE+利息</span><span>${fmt.pct(c.roceWithInterestPercent)}</span></div>` : ''}
      <div class="row"><span>負債比</span><span>${fmt.pct(c.debtRatioPercent)}</span></div>
      <div class="row"><span>FCF/股</span><span>${c.fcfPerShare != null ? c.fcfPerShare.toFixed(2)+' 元' : '-'}</span></div>
      <div class="row"><span>EPS</span><span>${c.eps != null ? c.eps.toFixed(2)+' 元' : '-'}</span></div>
      ${sc != null ? `<div class="row"><span>品質分</span><span style="font-weight:700;color:${scColor}">${sc.toFixed(1)}</span></div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('watchlist-content').innerHTML = `<div class="wl-grid">${cards}</div>`;
}

async function toggleWatchlist(stockNo, add) {
  const method = add ? 'POST' : 'DELETE';
  await fetch(`/api/stocks/${encodeURIComponent(stockNo)}/watchlist`, { method });
  toast(add ? `已加入觀察清單：${stockNo}` : `已移除：${stockNo}`);
  loadAnalysis(stockNo);
}

// ---------------------------------------------------------------------------
// Market screen
// ---------------------------------------------------------------------------
async function runScreen() {
  const minRoce  = document.getElementById('sc-roce').value || '15';
  const minScore = document.getElementById('sc-score').value || '0';
  const year     = document.getElementById('sc-year').value;
  const ind      = document.getElementById('sc-ind').value;
  const band     = document.getElementById('sc-band').value;
  let url = `/api/screen?min_roce=${minRoce}&min_score=${minScore}`;
  if (year) url += `&year=${year}`;
  if (ind)  url += `&industry=${encodeURIComponent(ind)}`;
  if (band) url += `&size_band=${band}`;
  document.getElementById('screen-content').innerHTML = '<div class="empty"><span class="spinner"></span>篩選中…</div>';
  try {
    const items = await (await fetch(url)).json();
    if (!items.length) { document.getElementById('screen-content').innerHTML = '<div class="empty">無符合條件的股票</div>'; return; }
    const rows = items.map(r => {
      const rc = r.rocePercent;
      const cls = rc >= 20 ? 'roce-high' : 'roce-med';
      const sc = r.score;
      const scColor = sc==null?'#94a3b8':sc>=80?'#059669':sc>=60?'#d97706':'#dc2626';
      const rankStr = r.industryRank != null ? `${r.industryRank}/${r.industryCount}` : '-';
      const bandStr = r.sizeBand ? ({Small:'小型',Medium:'中型',Large:'大型'}[r.sizeBand]||r.sizeBand) : '-';
      return `<tr>
        <td><a href="#" onclick="selectStock('${r.stockNo}');showTab('analysis');return false" style="color:#2563eb;text-decoration:none;font-weight:700">${r.stockNo}</a></td>
        <td>${r.name}</td>
        <td>${r.industryName}</td>
        <td>${r.fiscalYear}</td>
        <td class="${cls}">${fmt.pct(rc)}</td>
        <td>${fmt.pct(r.operatingMargin)}</td>
        <td>${fmt.pct(r.roe)}</td>
        <td>${fmt.pct(r.debtRatio)}</td>
        <td style="font-weight:700;color:${scColor}">${sc!=null?sc.toFixed(1):'-'}</td>
        <td>${rankStr}</td>
        <td>${bandStr}</td>
        <td>${r.eps != null ? r.eps.toFixed(2) : '-'}</td>
        <td>${fmt.yi(r.totalAssets)}</td>
      </tr>`;
    }).join('');
    document.getElementById('screen-content').innerHTML = `
      <p style="margin-bottom:10px;font-size:13px;color:#64748b">共 ${items.length} 檔符合條件</p>
      <div style="overflow-x:auto"><table>
        <thead><tr>
          <th style="text-align:left">代號</th><th style="text-align:left">名稱</th>
          <th style="text-align:left">產業</th><th>年度</th>
          <th>ROCE</th><th>營業利益率</th><th>ROE</th><th>負債比</th><th>品質分</th><th>產業排名</th><th>規模</th><th>EPS</th><th>資產總額</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
  } catch(e) {
    document.getElementById('screen-content').innerHTML = `<div class="empty">錯誤：${e}</div>`;
  }
}

// ---------------------------------------------------------------------------
// Refresh
// ---------------------------------------------------------------------------
async function refreshCatalog() {
  toast('更新目錄中，請稍候…');
  try {
    const r = await (await fetch('/api/refresh/catalog', {method:'POST'})).json();
    toast(r.message);
    loadWatchlist();
  } catch(e) { toast('更新失敗：'+e); }
}

async function refreshStock(stockNo) {
  toast(`從 MOPS 抓取 ${stockNo} 年報及季報…`);
  try {
    const r = await (await fetch(`/api/stocks/${encodeURIComponent(stockNo)}/refresh`, {method:'POST'})).json();
    toast(r.message);
    loadAnalysis(stockNo);
  } catch(e) { toast('刷新失敗：'+e); }
}

async function refreshPrices(stockNo) {
  toast(`抓取 ${stockNo} 股價…`);
  try {
    const r = await (await fetch(`/api/stocks/${encodeURIComponent(stockNo)}/prices/refresh`, {method:'POST'})).json();
    toast(r.message);
  } catch(e) { toast('股價刷新失敗：'+e); }
}

// ---------------------------------------------------------------------------
// Market scanner
// ---------------------------------------------------------------------------
async function loadScanStatus() {
  try {
    const p = await (await fetch('/api/market-scan/status')).json();
    renderScanStatus(p);
  } catch(e) { document.getElementById('scan-status').innerHTML = `<div class="empty">錯誤：${e}</div>`; }
}

function renderScanStatus(p) {
  const statusLabel = {Idle:'閒置',Running:'掃描中',Paused:'已暫停',Completed:'完成'}[p.status]||p.status;
  const statusColor = p.status==='Running'?'#2563eb':p.status==='Completed'?'#059669':p.status==='Paused'?'#d97706':'#64748b';
  const pct = p.total > 0 ? (p.completed/p.total*100).toFixed(1) : 0;
  const range = p.rangeStartFiscalYear != null ? `${p.rangeStartFiscalYear}–${p.rangeEndFiscalYear}` : p.fiscalYear;
  document.getElementById('scan-status').innerHTML = `
    <div style="font-size:14px;padding:10px 0">
      <span style="font-weight:700;color:${statusColor}">${statusLabel}</span>
      · 年度範圍 ${range} · ${p.completed}/${p.total} (${pct}%)
      · 成功 ${p.success} 筆，失敗 ${p.failed} 筆
      ${p.currentStockNo ? `· 目前：${p.currentStockNo}` : ''}
    </div>
    <div style="height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden">
      <div style="height:100%;width:${pct}%;background:${statusColor};transition:width .4s"></div>
    </div>`;
}

async function startScan() {
  const year = parseInt(document.getElementById('scan-year').value) || 2024;
  const years = parseInt(document.getElementById('scan-years').value) || 3;
  toast(`開始掃描 ${year-years+1}–${year} 年…`);
  try {
    const r = await (await fetch('/api/market-scan/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fiscalYear:year,years})})).json();
    renderScanStatus(r);
  } catch(e) { toast('掃描啟動失敗：'+e); }
}

async function pauseScan() {
  try {
    const r = await (await fetch('/api/market-scan/pause',{method:'POST'})).json();
    renderScanStatus(r);
    toast('掃描已暫停');
  } catch(e) { toast('暫停失敗：'+e); }
}

// ---------------------------------------------------------------------------
// Score template
// ---------------------------------------------------------------------------
let currentTemplate = null;

async function loadTemplate() {
  try {
    const t = await (await fetch('/api/score-template')).json();
    currentTemplate = t;
    renderTemplate(t);
  } catch(e) { document.getElementById('template-content').innerHTML = `<div class="empty">錯誤：${e}</div>`; }
}

function renderTemplate(t) {
  const metricLabels = {roce:'ROCE',operatingMargin:'營業利益率',roe:'ROE',debtRatio:'負債比',currentRatio:'流動比率'};
  const rows = t.rules.map((r,i) => {
    const label = metricLabels[r.metricKey] || r.metricKey;
    const pts = r.points.map(p=>`${p.value}→${p.score}`).join(', ');
    return `<tr>
      <td><input type="checkbox" ${r.isEnabled?'checked':''} onchange="templateRuleChange(${i},'enabled',this.checked)"> ${label}</td>
      <td><input type="number" value="${r.weight}" min="0" max="100" style="width:60px;padding:4px;border:1px solid #cbd5e1;border-radius:4px" onchange="templateRuleChange(${i},'weight',+this.value)"></td>
      <td style="font-size:11px;color:#64748b">${pts}</td>
    </tr>`;
  }).join('');
  document.getElementById('template-content').innerHTML = `
    <table style="width:100%">
      <thead><tr><th style="text-align:left">指標</th><th>權重 (%)</th><th style="text-align:left">門檻點</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function templateRuleChange(idx, field, val) {
  if (!currentTemplate) return;
  if (field === 'enabled') currentTemplate.rules[idx].isEnabled = val;
  if (field === 'weight')  currentTemplate.rules[idx].weight = val;
}

async function saveTemplate() {
  if (!currentTemplate) return;
  try {
    const r = await (await fetch('/api/score-template',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(currentTemplate)})).json();
    toast(r.message || '範本已儲存');
  } catch(e) { toast('儲存失敗：'+e); }
}

async function resetTemplate() {
  try {
    const t = await (await fetch('/api/score-template/reset',{method:'POST'})).json();
    currentTemplate = t;
    renderTemplate(t);
    toast('已還原預設範本');
  } catch(e) { toast('還原失敗：'+e); }
}

showTab('watchlist');
